<!DOCTYPE html>
<html lang="es">

<head>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Flores para ti 💛💙</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="contenedor">

    <section class="inicio">

      <h1>Tengo algo para ti 💛</h1>

      <p>
        Como no puedo darte flores en persona...
      </p>

      <button id="botonAbrir">
        Ábrelo 🌼
      </button>

    </section>


    <section class="regalo oculto">

      <canvas id="lienzoFlor"></canvas>

      <div class="texto-final">

        <h2>
          Feliz 21 de Septiembre Mely 💛
        </h2>

        <p class="mensaje">
          En medio de estas flores amarillas
          un pequeño corazón flores azules para ti 💙
        </p>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>

</html>
