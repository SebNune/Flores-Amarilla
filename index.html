<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Flores Amarillas 💛</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section id="inicio" class="inicio">

    <div class="tarjeta-inicio">

      <h1>Flores Amarillas 💛</h1>

      <p>
        Tengo algo pequeño para ti...
      </p>

      <button id="botonAbrir">
        Ver sorpresa 🌼
      </button>

    </div>

  </section>


  <section id="regalo" class="regalo oculto">

    <canvas id="lienzoFlor"></canvas>

    <div id="textoFinal" class="texto-final oculto">

      <h2>Para ti 💙</h2>

      <p>
        En medio de todas estas flores amarillas,
        un pequeño corazón de flores azules para ti.
      </p>

    </div>

  </section>


  <!-- v=10 evita que el navegador use JS antiguo -->
  <script src="script.js?v=10"></script>

</body>

</html>
