<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Flores Amarillas 💛</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Pantalla inicial -->
  <div class="inicio">

    <h1>Flores Amarillas 💛</h1>

    <p>
      Tengo algo pequeño para ti...
    </p>

    <button id="btnIniciar">
      Ver sorpresa 🌻
    </button>

  </div>


  <!-- Canvas donde se dibujan las flores -->
  <canvas id="lienzoFlor"></canvas>


  <!-- Mensaje que aparece al final -->
  <div class="texto-final">

    <h2>Para ti 💙</h2>

    <p class="mensaje">
      En medio de todas estas flores amarillas,
      un pequeño corazón de flores azules para ti 💙
    </p>

  </div>


  <script src="script.js"></script>

</body>

</html>
