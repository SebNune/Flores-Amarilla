<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Flores Amarillas 💛</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="contenedor">

    <!-- Pantalla inicial -->
    <section id="inicio" class="inicio">

      <h1>
        Tengo algo para ti 💛
      </h1>

      <p>
        Como no puedo darte flores en persona...
      </p>

      <button id="botonAbrir">
        Ábrelo 🌼
      </button>

    </section>


    <!-- Regalo -->
    <section id="regalo" class="regalo oculto">

      <canvas id="lienzoFlor"></canvas>


      <!-- Mensaje final -->
      <div
        id="textoFinal"
        class="texto-final oculto"
      >

        <h2>
          Feliz 21 de Septiembre Mely 💛
        </h2>

        <p class="mensaje">
          En medio de estas flores amarillas,
          un pequeño corazón de flores azules para ti 💙
        </p>

      </div>

    </section>

  </main>


  <!--
    El ?v=12 obliga al navegador a cargar
    la versión nueva del JavaScript.
  -->
  <script src="script.js?v=12"></script>

</body>

</html>
